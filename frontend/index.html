<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>附近餐廳搜尋</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Full-screen map (Folium iframe injected here) -->
  <div id="map-container">
    <div id="map-placeholder">
      <div class="placeholder-inner">
        <div class="spinner"></div>
        <p>載入地圖中…</p>
      </div>
    </div>
  </div>

  <!-- Top-right toolbar -->
  <div id="toolbar">
    <span id="toolbar-title">🍜 附近餐廳</span>
    <span id="location-display" style="font-size:.78rem;opacity:.7;display:none"></span>
    <!-- Location input row (hidden until relocate clicked) -->
    <div id="location-input-row" style="display:none;align-items:center;gap:.4rem;">
      <input id="location-input" type="text" placeholder="輸入地址，例如：台北市松山區"
             style="padding:.3rem .6rem;border-radius:6px;border:none;font-size:.82rem;width:220px;">
      <button id="location-search-btn" class="toolbar-btn" style="padding:.3rem .6rem;">搜尋</button>
      <button id="location-gps-btn"    class="toolbar-btn" style="padding:.3rem .6rem;" title="使用GPS">GPS</button>
      <button id="location-cancel-btn" class="toolbar-btn" style="padding:.3rem .5rem;opacity:.7;">✕</button>
    </div>
    <button id="relocate-btn" class="toolbar-btn" style="display:none" title="重新定位">📍 定位</button>
    <button id="admin-btn"    class="toolbar-btn" style="display:none" title="用戶管理">👥 用戶</button>
    <button id="logout-btn"   class="toolbar-btn" style="display:none" title="登出">⎋ 登出</button>
  </div>

  <!-- Admin users modal -->
  <div id="admin-overlay" style="display:none">
    <div id="admin-modal">
      <div id="admin-header">
        <span>👥 已註冊用戶</span>
        <button id="admin-close">✕</button>
      </div>
      <div id="admin-body">
        <div class="spinner" style="margin:1.5rem auto"></div>
      </div>
    </div>
  </div>

  <!-- Login / Register modal (shown until authenticated) -->
  <div id="login-overlay">
    <div id="login-modal">
      <h2>🍜 附近餐廳搜尋</h2>

      <!-- LOGIN PANEL -->
      <div id="login-panel">
        <p class="login-subtitle">登入後即可搜尋您附近的餐廳</p>
        <form id="login-form">
          <label for="username">帳號</label>
          <input id="username" type="text" placeholder="帳號" required autocomplete="username">
          <label for="password">密碼</label>
          <input id="password" type="password" placeholder="••••••" required autocomplete="current-password">
          <button type="submit" class="btn-login">登入</button>
        </form>
        <p id="login-error" class="error-text"></p>
        <p class="auth-switch">還沒有帳號？<a id="show-register" href="#">立即註冊</a></p>
      </div>

      <!-- REGISTER PANEL (hidden by default) -->
      <div id="register-panel" style="display:none">
        <p class="login-subtitle">建立新帳號</p>
        <form id="register-form">
          <label for="reg-username">帳號 <span class="field-hint">（2–20 字元）</span></label>
          <input id="reg-username" type="text" placeholder="輸入帳號" required autocomplete="username">
          <label for="reg-password">密碼 <span class="field-hint">（至少 6 碼）</span></label>
          <input id="reg-password" type="password" placeholder="••••••" required autocomplete="new-password">
          <label for="reg-confirm">確認密碼</label>
          <input id="reg-confirm" type="password" placeholder="再輸入一次" required autocomplete="new-password">
          <button type="submit" class="btn-login">註冊</button>
        </form>
        <p id="register-error" class="error-text"></p>
        <p id="register-success" class="success-text" style="display:none"></p>
        <p class="auth-switch">已有帳號？<a id="show-login" href="#">返回登入</a></p>
      </div>
    </div>
  </div>

  <!-- Left floating wallet button (above groups-btn) -->
  <button id="wallet-btn" style="display:none" title="我的錢包">💰</button>

  <!-- Left floating groups button (above fav-tab) -->
  <button id="groups-btn" style="display:none" title="群組">
    👪<span id="inv-badge" class="inv-badge" style="display:none">0</span>
  </button>

  <!-- Left favourites sidebar -->
  <div id="fav-sidebar">
    <div id="fav-tab" title="我的最愛">❤️</div>
    <div id="fav-content">
      <div id="fav-panel-header">❤️ 我的最愛</div>
      <div id="fav-list"></div>
      <div id="fav-footer">
        <button id="fav-show-all-btn">🗺 全部顯示在地圖</button>
      </div>
    </div>
  </div>

  <!-- Floating camera button (above dice) -->
  <label id="camera-btn" title="拍照辨識食物" style="display:none">📷
    <input id="camera-input" type="file" accept="image/*" style="display:none">
  </label>

  <!-- Floating dice button (above chat toggle) -->
  <button id="spin-btn" title="幫我決定吃什麼！" style="display:none">🎲</button>

  <!-- Floating chat button -->
  <button id="chat-toggle" title="開始搜尋" style="display:none">
    <span id="chat-toggle-icon">💬</span>
  </button>

  <!-- Chat panel -->
  <div id="chat-panel" style="display:none">
    <div id="chat-header">
      <span>🍜 餐廳搜尋助理</span>
      <button id="api-toggle" class="api-toggle" title="切換搜尋來源">
        <span id="api-toggle-label">🗺 Nominatim</span>
      </button>
      <button id="chat-close" title="關閉">✕</button>
    </div>

    <div id="chat-messages">
      <div class="msg bot">
        <span class="msg-bubble">您好！請告訴我您想吃什麼？例如：<br>
          <em>「10分鐘內的健康午餐」</em><br>
          <em>「我想吃麥當勞」</em><br>
          <em>「附近的甜點店」</em>
        </span>
      </div>
    </div>

    <!-- Signature badge (inside chat) -->
    <div id="signature-badge" style="display:none"></div>

    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="輸入您的需求…" autocomplete="off">
      <button type="submit" id="send-btn">➤</button>
    </form>
  </div>

  <!-- Standalone wallet panel -->
  <div id="wallet-panel" style="display:none">
    <div id="gp-wallet-header">
      <span>💰 我的錢包</span>
    </div>
    <div id="gp-wallet-balance-card">
      <div id="gp-wallet-label">目前餘額</div>
      <div id="gp-wallet-amount">$0</div>
    </div>
    <div id="gp-wallet-tx-title">消費紀錄</div>
    <div id="gp-wallet-tx-list"></div>
  </div>

  <!-- Groups side panel -->
  <div id="groups-panel" style="display:none">

    <!-- VIEW 1: group list -->
    <div id="gp-list-view">
      <div id="gp-list-header">
        <span>👪 我的群組</span>
        <button id="gp-close">✕</button>
      </div>
      <div id="gp-invitations-bar" style="display:none">
        🔔 <span id="gp-inv-count">0</span> 個待接受邀請
        <button id="gp-inv-open">查看</button>
      </div>
      <div id="gp-list-body"></div>
      <button id="gp-create-btn">＋ 建立新群組</button>
    </div>

    <!-- VIEW 2: invitations list -->
    <div id="gp-inv-view" style="display:none">
      <div id="gp-inv-header">
        <button id="gp-inv-back">← 返回</button>
        <span>待接受邀請</span>
      </div>
      <div id="gp-inv-body"></div>
    </div>

    <!-- VIEW 3: group detail (tabs) -->
    <div id="gp-detail-view" style="display:none">
      <div id="gp-detail-header">
        <button id="gp-detail-back">←</button>
        <span id="gp-detail-name"></span>
        <button id="gp-delete-btn" style="display:none" title="刪除群組">🗑</button>
      </div>
      <div id="gp-tabs">
        <button class="gp-tab active" data-tab="chat">💬 聊天</button>
        <button class="gp-tab" data-tab="votes">🗳 投票</button>
        <button class="gp-tab" data-tab="members">👥 成員</button>
      </div>
      <!-- Chat tab -->
      <div id="gp-tab-chat" class="gp-tab-content">
        <div id="gp-messages"></div>
        <form id="gp-msg-form">
          <input id="gp-msg-input" placeholder="輸入訊息…" autocomplete="off">
          <button type="submit">➤</button>
        </form>
      </div>
      <!-- Votes tab -->
      <div id="gp-tab-votes" class="gp-tab-content" style="display:none">
        <div id="gp-votes-body"></div>
      </div>
      <!-- Members tab -->
      <div id="gp-tab-members" class="gp-tab-content" style="display:none">
        <div id="gp-my-balance-bar">💰 我的餘額：<strong id="gp-my-balance">$0</strong></div>
        <div id="gp-members-list"></div>
        <div id="gp-invite-form">
          <input id="gp-invite-input" placeholder="搜尋使用者名稱…" autocomplete="off">
          <button id="gp-invite-btn">邀請</button>
        </div>
        <div id="gp-invite-result"></div>
      </div>
    </div>
  </div>

  <!-- Share-to-group modal -->
  <div id="share-overlay" style="display:none">
    <div id="share-modal">
      <h3>🗳 分享到群組發起投票</h3>
      <div class="share-field">
        <label for="share-title">投票標題</label>
        <input id="share-title" placeholder="例如：今天吃什麼？">
      </div>
      <div class="share-field">
        <label for="share-group-select">選擇群組</label>
        <select id="share-group-select"></select>
      </div>
      <div class="share-field">
        <label>選擇餐廳（最多 8 間）</label>
        <div id="share-options-list"></div>
      </div>
      <div id="share-error" class="error-text"></div>
      <div id="share-modal-actions">
        <button id="share-cancel">取消</button>
        <button id="share-submit">發起投票</button>
      </div>
    </div>
  </div>

  <!-- Spin modal -->
  <div id="spin-overlay" style="display:none">
    <div id="spin-modal">
      <div id="spin-title">🎲 今天吃什麼？</div>
      <div id="spin-slot">
        <div id="spin-emoji"></div>
        <div id="spin-label"></div>
      </div>
      <div id="spin-result" style="display:none">
        <button id="spin-confirm-btn">開始搜尋！</button>
        <button id="spin-again-btn">再轉一次</button>
      </div>
      <button id="spin-cancel-btn">✕ 取消</button>
    </div>
  </div>

  <!-- Transfer modal -->
  <div id="transfer-overlay" style="display:none">
    <div id="transfer-modal">
      <h3>💸 轉帳</h3>
      <div class="transfer-field">
        <label>收款人</label>
        <span id="transfer-to-name"></span>
      </div>
      <div class="transfer-field">
        <label for="transfer-amount">金額 ($)</label>
        <input id="transfer-amount" type="number" min="1" step="1" placeholder="輸入金額">
      </div>
      <div class="transfer-field">
        <label for="transfer-note">備註（選填）</label>
        <input id="transfer-note" type="text" placeholder="例如：午餐費">
      </div>
      <div id="transfer-modal-actions">
        <button id="transfer-cancel">取消</button>
        <button id="transfer-submit">確認轉帳</button>
      </div>
      <div id="transfer-result"></div>
    </div>
  </div>

  <!-- Admin adjust wallet modal -->
  <div id="adjust-overlay" style="display:none">
    <div id="adjust-modal">
      <h3>✏️ 設定餘額</h3>
      <div class="transfer-field">
        <label>用戶</label>
        <span id="adjust-username"></span>
      </div>
      <div class="transfer-field">
        <label for="adjust-amount">設為 ($)</label>
        <input id="adjust-amount" type="number" min="0" step="1" placeholder="輸入新餘額">
      </div>
      <div id="adjust-modal-actions">
        <button id="adjust-cancel">取消</button>
        <button id="adjust-submit">確認</button>
      </div>
      <div id="adjust-result"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/signature.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
